<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Blockout PvZ — Zombie</title>
  <style>
    :root {
      --bg: #e8ebee;
      --panel: rgba(255, 255, 255, 0.92);
      --text: #1f2328;
      --muted: #5d6570;
      --line: #d3d8de;
      --btn: #ffffff;
      --btnOn: #1f2328;
      --btnOnText: #ffffff;
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1d21; --panel: rgba(34, 38, 43, 0.92); --text: #e9ecef;
        --muted: #9aa3ad; --line: #353b42; --btn: #262a30;
        --btnOn: #e9ecef; --btnOnText: #1a1d21;
      }
    }
    *, *::before, *::after { box-sizing: inherit; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    .panel { position: absolute; left: 16px; top: 16px; width: 280px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); backdrop-filter: blur(12px); border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 20px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
    button { appearance: none; background: var(--btn); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; }
    button:hover { border-color: var(--muted); }
    button.on { background: var(--btnOn); color: var(--btnOnText); border-color: transparent; }
    .legend { font-size: 13px; line-height: 1.5; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; }
    .q { display: inline-block; padding: 2px 6px; background: rgba(0,0,0,0.06); border-radius: 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; vertical-align: middle; }
    #tut { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; pointer-events: none; transition: opacity 0.5s; backdrop-filter: blur(4px); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="panel">
    <button id="bx">Pisahkan Bagian</button>
    <button id="bc">Warna Asli</button>
    <button id="bp">Pause / Play Animasi</button>
    <button id="bs">Bayangan: ON</button>
    <div class="legend" id="legend">
      <div id="rows"></div>
    </div>
  </div>
  <div id="tut">Drag untuk rotasi • Scroll untuk zoom</div>
  <script type="module" src="main.js"></script>
  <script>
    setTimeout(() => {
      const tut = document.getElementById("tut");
      if (tut) { tut.style.opacity = 0; setTimeout(() => tut.remove(), 500); }
    }, 4000);
  </script>
</body>
</html>
